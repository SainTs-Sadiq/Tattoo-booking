<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>SadSaints Admin</title><style>:root{--bg:#090909;--panel:#141414;--line:#303030;--fg:#eee;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:auto;padding:30px 20px 80px}h1,h2{font-family:Oswald,Impact,sans-serif;text-transform:uppercase}.card{background:var(--panel);border:1px solid var(--line);padding:20px;margin-bottom:22px}input,select{width:100%;background:#080808;color:#eee;border:1px solid var(--line);padding:11px;margin-top:6px}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.row>label{flex:1 1 240px}.btn{border:1px solid #777;background:#eee;color:#080808;padding:10px 15px;cursor:pointer;font-weight:800}.btn.dark{background:transparent;color:#eee}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.item{background:#111;border:1px solid var(--line);padding:10px}.item img{width:100%;aspect-ratio:3/4;object-fit:cover;filter:grayscale(1)}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.status{color:#bbb;min-height:24px}.hide{display:none}.booking{border-top:1px solid var(--line);padding:15px 0}.booking summary{cursor:pointer;font-weight:800}.booking dl{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;color:#aaa}.booking dd{margin:0;color:#eee;word-break:break-word}@media(max-width:650px){.booking dl{grid-template-columns:1fr}.row{display:block}.row>*{display:block;margin-bottom:12px}}</style></head><body><header><strong>SadSaints Admin</strong><nav><a href="/" style="color:#aaa;margin-right:15px">View site</a><button id="logout" class="btn dark hide">Sign out</button></nav></header><main><section id="login" class="card"><h1>Admin login</h1><form id="lf"><label>Password<input id="pw" type="password" required autocomplete="current-password"></label><p id="ls" class="status"></p><button class="btn" type="submit">Sign in</button></form></section><section id="app" class="hide"><div class="card"><h2>Portfolio</h2><div class="row"><label>Photos<input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp"></label><label>Caption<input id="caption" maxlength="80" placeholder="e.g. Serpent and shade"></label><button id="upload" class="btn">Upload</button></div><p id="us" class="status"></p></div><div class="card"><h2>Portfolio images</h2><div id="grid" class="grid"></div><p id="empty" class="status"></p></div><div class="card"><h2>Booking requests</h2><div id="bookings"></div><p id="bs" class="status"></p></div></section></main><script>const $=id=>document.getElementById(id);const api=async(u,o)=>{const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'Request failed'),{status:r.status});return d};function show(on){$('login').classList.toggle('hide',on);$('app').classList.toggle('hide',!on);$('logout').classList.toggle('hide',!on)}async function start(){try{await api('/api/me');show(true);loadPortfolio();loadBookings()}catch{show(false)}}$('lf').onsubmit=async e=>{e.preventDefault();$('ls').textContent='';try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});$('pw').value='';start()}catch(e){$('ls').textContent=e.message}};$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});show(false)};function shrink(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{URL.revokeObjectURL(u);const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b&&b.size<4e6?res(b):rej(new Error(file.name+' is too large')),'image/jpeg',.86)};im.onerror=()=>rej(new Error('Could not read '+file.name));im.src=u})}async function loadPortfolio(){const items=await api('/api/portfolio'),g=$('grid');g.innerHTML='';$('empty').textContent=items.length?'':'No portfolio images yet.';items.forEach((it,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML='<img src="'+it.url+'" alt="'+(it.caption||'Portfolio photo').replace(/"/g,'&quot;')+'">';const cap=document.createElement('input');cap.value=it.caption||'';cap.maxLength=80;cap.onchange=()=>api('/api/portfolio?id='+it.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({caption:cap.value})});d.append(cap);const a=document.createElement('div');a.className='actions';const btn=(t,fn)=>{const b=document.createElement('button');b.className='btn dark';b.textContent=t;b.onclick=fn;a.append(b)};if(i)btn('Move up',async()=>{await api('/api/portfolio?id='+it.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({move:'up'})});loadPortfolio()});if(i<items.length-1)btn('Move down',async()=>{await api('/api/portfolio?id='+it.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({move:'down'})});loadPortfolio()});btn('Delete',async()=>{if(confirm('Delete this photo?')){await api('/api/portfolio?id='+it.id,{method:'DELETE'});loadPortfolio()}});d.append(a);g.append(d)})}$('upload').onclick=async()=>{const fs=[...$('files').files];if(!fs.length){$('us').textContent='Choose at least one image.';return}$('upload').disabled=true;try{for(const f of fs){const b=await shrink(f);await api('/api/portfolio?caption='+encodeURIComponent($('caption').value),{method:'POST',headers:{'Content-Type':'image/jpeg'},body:b})}$('us').textContent='Upload complete.';$('files').value='';$('caption').value='';loadPortfolio()}catch(e){$('us').textContent=e.message;if(e.status===401)show(false)}finally{$('upload').disabled=false}};async function loadBookings(){try{const d=await api('/api/admin-bookings');const el=$('bookings');el.innerHTML='';$('bs').textContent=d.bookings.length?d.bookings.length+' recent booking request(s).':'No booking requests yet.';d.bookings.forEach(b=>{const box=document.createElement('details');box.className='booking';const dt=new Date(b.created_at).toLocaleString();box.innerHTML='<summary>'+dt+' — '+(b.name||'Unnamed')+' — '+(b.status||'pending')+'</summary><dl><dt>Email</dt><dd>'+b.email+'</dd><dt>Phone</dt><dd>'+b.phone+'</dd><dt>Service</dt><dd>Home service</dd><dt>Preferred date</dt><dd>'+'(b.preferred_date||'Not provided')+'</dd><dt>Preferred time</dt><dd>'+'(b.preferred_time||'Not provided')+'</dd><dt>Payment</dt><dd>'+(((b.notes||'').match(/Payment method: ([^\n]+)/)||[])[1]||'Not provided')+'</dd><dt>Location</dt><dd>'+b.location+'</dd><dt>Placement</dt><dd>'+b.placement+'</dd><dt>References</dt><dd>'+b.reference_links+'</dd><dt>Notes</dt><dd>'+b.notes+'</dd></dl>';const sel=document.createElement('select');['pending','confirmed','declined','cancelled'].forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;o.selected=s===b.status;sel.append(o)});sel.onchange=async()=>{await api('/api/admin-bookings?id='+b.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:sel.value})});loadBookings()};box.append(sel);el.append(box)})}catch(e){$('bs').textContent=e.message}}start();</script></body></html>
